name: Build and Release Tetru

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: tetru-linux-x86_64
            binary: tetru
          - os: macos-latest
            artifact_name: tetru-macos-universal
            binary: tetru
          - os: windows-latest
            artifact_name: tetru-windows-x86_64
            binary: tetru.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MinGW & PDCurses (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pdcurses

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: make

      - name: Build (Windows MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          gcc -Wall -Wextra -O2 -I/mingw64/include -I/mingw64/include/pdcurses main.c -o tetru.exe -L/mingw64/lib -lpdcurses

      - name: Upload Artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: tetru

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: tetru.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package Archives
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          cd release-artifacts
          chmod +x tetru-linux-x86_64/tetru
          tar -czvf tetru-linux-x86_64.tar.gz -C tetru-linux-x86_64 tetru
          chmod +x tetru-macos-universal/tetru
          tar -czvf tetru-macos-universal.tar.gz -C tetru-macos-universal tetru
          zip -j tetru-windows-x86_64.zip tetru-windows-x86_64/tetru.exe ../README.md ../LICENSE

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Tetru ${{ github.ref_name }}"
          body: |
            ## Tetru ${{ github.ref_name }}
            
            ### Changelog
            - Cross-platform support for Linux, macOS, and Windows.
            - Multiple game modes: Classic, 40-Line Sprint, Survival Rush, and VS AI Battle.
            - 5 AI difficulty settings.
            - Cryptographically signed anti-tamper career stats.
            - Smooth controls, wall kicks, and 450ms lock delay.
            - Dynamic animated TUI with particle bursts and screen shake.
          files: |
            release-artifacts/tetru-linux-x86_64.tar.gz
            release-artifacts/tetru-macos-universal.tar.gz
            release-artifacts/tetru-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
